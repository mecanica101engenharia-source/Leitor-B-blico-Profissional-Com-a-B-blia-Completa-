<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 Leitor Bíblico Pro</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #2d3436;
            --card-bg: #ffffff;
            --primary: #667eea;
            --verse-num: #e17055;
            --border: #dfe6e9;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a2e;
            --text-color: #dfe6e9;
            --card-bg: #16213e;
            --primary: #a29bfe;
            --verse-num: #fab1a0;
            --border: #2d3436;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: background 0.3s, color 0.3s; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, var(--primary), #764ba2);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 { font-size: 1.8rem; margin-bottom: 15px; }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
        }

        select, button {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
            cursor: pointer;
            outline: none;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
        }

        button:hover { opacity: 0.9; }

        .font-controls {
            display: flex;
            gap: 5px;
            align-items: center;
            background: rgba(255,255,255,0.2);
            padding: 5px 10px;
            border-radius: 8px;
        }

        .font-controls button {
            background: transparent;
            border: 1px solid white;
            padding: 5px 10px;
            font-size: 1.2rem;
        }

        main {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
        }

        .bible-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        .chapter-title {
            text-align: center;
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border);
        }

        .verse {
            margin-bottom: 15px;
            text-align: justify;
            font-family: 'Georgia', serif;
            line-height: 1.8;
        }

        .verse-num {
            color: var(--verse-num);
            font-weight: bold;
            font-size: 0.8em;
            vertical-align: super;
            margin-right: 4px;
            font-family: 'Segoe UI', sans-serif;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: var(--primary);
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #d63031;
            background: rgba(214, 48, 49, 0.1);
            border-radius: 10px;
        }

        .retry-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-color);
            opacity: 0.7;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .controls { flex-direction: column; }
            select, button { width: 100%; }
            .bible-card { padding: 20px; }
            .chapter-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>📖 Leitor Bíblico Pro</h1>
        <div class="controls">
            <select id="bookSelect"></select>
            <select id="chapterSelect">
                <option value="1">Capítulo 1</option>
            </select>
            <button onclick="loadChapter()">Ler</button>
            
            <div class="font-controls">
                <button onclick="changeFontSize(-1)">A-</button>
                <button onclick="changeFontSize(1)">A+</button>
                <button onclick="toggleTheme()" title="Modo Escuro/Claro">🌓</button>
            </div>
        </div>
    </header>

    <main>
        <div id="content" class="bible-card">
            <div class="loading">Carregando as Sagradas Escrituras...</div>
        </div>
    </main>

    <footer>
        <p>Tradução: Almeida Revista e Atualizada | Leitor Bíblico Pro</p>
    </footer>

    <script>
        const bibleBooks = {
            "Gênesis": "genesis", "Êxodo": "exodus", "Levítico": "leviticus", "Números": "numbers",
            "Deuteronômio": "deuteronomy", "Josué": "joshua", "Juízes": "judges", "Rute": "ruth",
            "1 Samuel": "1samuel", "2 Samuel": "2samuel", "1 Reis": "1kings", "2 Reis": "2kings",
            "1 Crônicas": "1chronicles", "2 Crônicas": "2chronicles", "Esdras": "ezra", "Neemias": "nehemiah",
            "Ester": "esther", "Jó": "job", "Salmos": "psalms", "Provérbios": "proverbs",
            "Eclesiastes": "ecclesiastes", "Cânticos": "songofsolomon", "Isaías": "isaiah", "Jeremias": "jeremiah",
            "Lamentações": "lamentations", "Ezequiel": "ezekiel", "Daniel": "daniel", "Oseias": "hosea",
            "Joel": "joel", "Amós": "amos", "Obadias": "obadiah", "Jonas": "jonah",
            "Miqueias": "micah", "Naum": "nahum", "Habacuque": "habakkuk", "Sofonias": "zephaniah",
            "Ageu": "haggai", "Zacarias": "zechariah", "Malaquias": "malachi",
            "Mateus": "matthew", "Marcos": "mark", "Lucas": "luke", "João": "john",
            "Atos": "acts", "Romanos": "romans", "1 Coríntios": "1corinthians", "2 Coríntios": "2corinthians",
            "Gálatas": "galatians", "Efésios": "ephesians", "Filipenses": "philippians", "Colossenses": "colossians",
            "1 Tessalonicenses": "1thessalonians", "2 Tessalonicenses": "2thessalonians", "1 Timóteo": "1timothy",
            "2 Timóteo": "2timothy", "Tito": "titus", "Filemom": "philemon", "Hebreus": "hebrews",
            "Tiago": "james", "1 Pedro": "1peter", "2 Pedro": "2peter", "1 João": "1john",
            "2 João": "2john", "3 João": "3john", "Judas": "jude", "Apocalipse": "revelation"
        };

        const bookSelect = document.getElementById('bookSelect');
        const chapterSelect = document.getElementById('chapterSelect');
        const contentDiv = document.getElementById('content');
        let currentFontSize = 1.1;

        Object.keys(bibleBooks).forEach(book => {
            const option = document.createElement('option');
            option.value = book;
            option.textContent = book;
            bookSelect.appendChild(option);
        });

        bookSelect.value = "Provérbios";
        updateChapters(31);

        bookSelect.addEventListener('change', () => {
            const book = bookSelect.value;
            let maxChapters = 28;
            
            if (book === "Salmos") maxChapters = 150;
            else if (book === "Provérbios") maxChapters = 31;
            else if (book === "Isaías") maxChapters = 66;
            else if (book === "Jeremias") maxChapters = 52;
            else if (book === "Ezequiel") maxChapters = 48;
            else if (["Gênesis", "Êxodo", "Números", "Josué", "Juízes", "1 Samuel", "2 Samuel", "1 Reis", "2 Reis", "1 Crônicas", "Neemias", "Jó", "Mateus", "Lucas", "Atos", "Apocalipse"].includes(book)) {
                maxChapters = 50;
            }
            updateChapters(maxChapters);
        });

        function updateChapters(max) {
            chapterSelect.innerHTML = '';
            for (let i = 1; i <= max; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = `Capítulo ${i}`;
                chapterSelect.appendChild(option);
            }
            chapterSelect.value = 1;
        }

        async function loadChapter() {
            const bookPt = bookSelect.value;
            const chapter = chapterSelect.value;
            const bookEn = bibleBooks[bookPt];

            contentDiv.innerHTML = '<div class="loading">⏳ Buscando o capítulo...</div>';

            try {
                // Tenta a API principal
                const response = await fetch(`https://bible-api.com/${bookEn}+${chapter}?translation=almeida`);
                
                if (!response.ok) throw new Error("API falhou");
                
                const data = await response.json();
                
                if (!data.verses || data.verses.length === 0) {
                    throw new Error("Nenhum versículo encontrado");
                }
                
                let html = `<h2 class="chapter-title">${bookPt} ${chapter}</h2>`;
                
                data.verses.forEach(verse => {
                    html += `
                        <div class="verse" style="font-size: ${currentFontSize}rem;">
                            <sup class="verse-num">${verse.verse}</sup>
                            ${verse.text}
                        </div>
                    `;
                });
                
                contentDiv.innerHTML = html;
                window.scrollTo({ top: 0, behavior: 'smooth' });

            } catch (error) {
                // Se falhar, tenta API alternativa
                try {
                    const altResponse = await fetch(`https://www.abibliadigital.com.br/api/verses/nvi/${bookPt.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')}/${chapter}`);
                    
                    if (altResponse.ok) {
                        const altData = await altResponse.json();
                        let html = `<h2 class="chapter-title">${bookPt} ${chapter}</h2>`;
                        
                        altData.verses.forEach(verse => {
                            html += `
                                <div class="verse" style="font-size: ${currentFontSize}rem;">
                                    <sup class="verse-num">${verse.number}</sup>
                                    ${verse.text}
                                </div>
                            `;
                        });
                        
                        contentDiv.innerHTML = html;
                    } else {
                        throw new Error("Segunda API também falhou");
                    }
                } catch (altError) {
                    contentDiv.innerHTML = `
                        <div class="error">
                            <h3>😕 Ops! Não foi possível carregar</h3>
                            <p>O servidor bíblico está temporariamente indisponível.</p>
                            <p>Tente novamente em alguns segundos.</p>
                            <button class="retry-btn" onclick="loadChapter()">🔄 Tentar Novamente</button>
                        </div>
                    `;
                }
            }
        }

        function changeFontSize(delta) {
            currentFontSize += delta * 0.1;
            if (currentFontSize < 0.8) currentFontSize = 0.8;
            if (currentFontSize > 2.0) currentFontSize = 2.0;
            
            const verses = document.querySelectorAll('.verse');
            verses.forEach(v => v.style.fontSize = `${currentFontSize}rem`);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        // Carrega automaticamente
        setTimeout(() => loadChapter(), 500);
    </script>
</body>
</html>
