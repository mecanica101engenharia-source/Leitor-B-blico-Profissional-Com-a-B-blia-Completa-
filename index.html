<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 Leitor Bíblico Pro</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #2d3436;
            --card-bg: #ffffff;
            --primary: #667eea;
            --verse-num: #e17055;
            --border: #dfe6e9;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a2e;
            --text-color: #dfe6e9;
            --card-bg: #16213e;
            --primary: #a29bfe;
            --verse-num: #fab1a0;
            --border: #2d3436;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: background 0.3s, color 0.3s; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, var(--primary), #764ba2);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 { font-size: 1.8rem; margin-bottom: 15px; }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
        }

        select, button {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
            cursor: pointer;
            outline: none;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
        }

        button:hover { opacity: 0.9; }

        .font-controls {
            display: flex;
            gap: 5px;
            align-items: center;
            background: rgba(255,255,255,0.2);
            padding: 5px 10px;
            border-radius: 8px;
        }

        .font-controls button {
            background: transparent;
            border: 1px solid white;
            padding: 5px 10px;
            font-size: 1.2rem;
        }

        main {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
        }

        .bible-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        .chapter-title {
            text-align: center;
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border);
        }

        .verse {
            margin-bottom: 15px;
            text-align: justify;
            font-family: 'Georgia', serif;
            line-height: 1.8;
        }

        .verse-num {
            color: var(--verse-num);
            font-weight: bold;
            font-size: 0.8em;
            vertical-align: super;
            margin-right: 4px;
            font-family: 'Segoe UI', sans-serif;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: var(--primary);
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #d63031;
            background: rgba(214, 48, 49, 0.1);
            border-radius: 10px;
        }

        .retry-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-color);
            opacity: 0.7;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .controls { flex-direction: column; }
            select, button { width: 100%; }
            .bible-card { padding: 20px; }
            .chapter-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>📖 Leitor Bíblico Pro</h1>
        <div class="controls">
            <select id="bookSelect"></select>
            <select id="chapterSelect">
                <option value="1">Capítulo 1</option>
            </select>
            <button onclick="loadChapter()">Ler</button>
            
            <div class="font-controls">
                <button onclick="changeFontSize(-1)">A-</button>
                <button onclick="changeFontSize(1)">A+</button>
                <button onclick="toggleTheme()" title="Modo Escuro/Claro"></button>
            </div>
        </div>
    </header>

    <main>
        <div id="content" class="bible-card">
            <div class="loading">Carregando as Sagradas Escrituras...</div>
        </div>
    </main>

    <footer>
        <p>Tradução: NVI (Nova Versão Internacional) | Leitor Bíblico Pro</p>
    </footer>

    <script>
        // Mapeamento CORRETO dos livros em Português para API
        const bibleBooksMap = {
            "Gênesis": { api: "genesis", caps: 50 },
            "Êxodo": { api: "exodo", caps: 40 },
            "Levítico": { api: "levitico", caps: 27 },
            "Números": { api: "numeros", caps: 36 },
            "Deuteronômio": { api: "deuteronomio", caps: 34 },
            "Josué": { api: "josue", caps: 24 },
            "Juízes": { api: "juizes", caps: 21 },
            "Rute": { api: "rute", caps: 4 },
            "1 Samuel": { api: "1samuel", caps: 31 },
            "2 Samuel": { api: "2samuel", caps: 24 },
            "1 Reis": { api: "1reis", caps: 22 },
            "2 Reis": { api: "2reis", caps: 25 },
            "1 Crônicas": { api: "1cronicas", caps: 29 },
            "2 Crônicas": { api: "2cronicas", caps: 36 },
            "Esdras": { api: "esdras", caps: 10 },
            "Neemias": { api: "neemias", caps: 13 },
            "Ester": { api: "ester", caps: 10 },
            "Jó": { api: "jo", caps: 42 },
            "Salmos": { api: "salmos", caps: 150 },
            "Provérbios": { api: "proverbios", caps: 31 },
            "Eclesiastes": { api: "eclesiastes", caps: 12 },
            "Cânticos": { api: "cantares", caps: 8 },
            "Isaías": { api: "isaias", caps: 66 },
            "Jeremias": { api: "jeremias", caps: 52 },
            "Lamentações": { api: "lamentacoes", caps: 5 },
            "Ezequiel": { api: "ezequiel", caps: 48 },
            "Daniel": { api: "daniel", caps: 12 },
            "Oseias": { api: "oseias", caps: 14 },
            "Joel": { api: "joel", caps: 3 },
            "Amós": { api: "amos", caps: 9 },
            "Obadias": { api: "obadias", caps: 1 },
            "Jonas": { api: "jonas", caps: 4 },
            "Miqueias": { api: "miqueias", caps: 7 },
            "Naum": { api: "naum", caps: 3 },
            "Habacuque": { api: "habacuque", caps: 3 },
            "Sofonias": { api: "sofonias", caps: 3 },
            "Ageu": { api: "ageu", caps: 2 },
            "Zacarias": { api: "zacarias", caps: 14 },
            "Malaquias": { api: "malaquias", caps: 4 },
            "Mateus": { api: "mateus", caps: 28 },
            "Marcos": { api: "marcos", caps: 16 },
            "Lucas": { api: "lucas", caps: 24 },
            "João": { api: "joao", caps: 21 },
            "Atos": { api: "atos", caps: 28 },
            "Romanos": { api: "romanos", caps: 16 },
            "1 Coríntios": { api: "1corintios", caps: 16 },
            "2 Coríntios": { api: "2corintios", caps: 13 },
            "Gálatas": { api: "galatas", caps: 6 },
            "Efésios": { api: "efesios", caps: 6 },
            "Filipenses": { api: "filipenses", caps: 4 },
            "Colossenses": { api: "colossenses", caps: 4 },
            "1 Tessalonicenses": { api: "1tessalonicenses", caps: 5 },
            "2 Tessalonicenses": { api: "2tessalonicenses", caps: 3 },
            "1 Timóteo": { api: "1timoteo", caps: 6 },
            "2 Timóteo": { api: "2timoteo", caps: 4 },
            "Tito": { api: "tito", caps: 3 },
            "Filemom": { api: "filemom", caps: 1 },
            "Hebreus": { api: "hebreus", caps: 13 },
            "Tiago": { api: "tiago", caps: 5 },
            "1 Pedro": { api: "1pedro", caps: 5 },
            "2 Pedro": { api: "2pedro", caps: 3 },
            "1 João": { api: "1joao", caps: 5 },
            "2 João": { api: "2joao", caps: 1 },
            "3 João": { api: "3joao", caps: 1 },
            "Judas": { api: "judas", caps: 1 },
            "Apocalipse": { api: "apocalipse", caps: 22 }
        };

        const bookSelect = document.getElementById('bookSelect');
        const chapterSelect = document.getElementById('chapterSelect');
        const contentDiv = document.getElementById('content');
        let currentFontSize = 1.1;

        // Preencher o seletor de livros
        Object.keys(bibleBooksMap).forEach(book => {
            const option = document.createElement('option');
            option.value = book;
            option.textContent = book;
            bookSelect.appendChild(option);
        });

        // Definir Provérbios como padrão
        bookSelect.value = "Provérbios";
        updateChapters(31);

        bookSelect.addEventListener('change', () => {
            const book = bookSelect.value;
            const maxChapters = bibleBooksMap[book].caps;
            updateChapters(maxChapters);
        });

        function updateChapters(max) {
            chapterSelect.innerHTML = '';
            for (let i = 1; i <= max; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = `Capítulo ${i}`;
                chapterSelect.appendChild(option);
            }
            chapterSelect.value = 1;
        }

        async function loadChapter() {
            const bookPt = bookSelect.value;
            const chapter = chapterSelect.value;
            const bookApi = bibleBooksMap[bookPt].api;

            contentDiv.innerHTML = '<div class="loading">⏳ Buscando o capítulo...</div>';

            try {
                // API Principal - Bible API em Português
                const url = `https://bible-api.com/${bookApi}+${chapter}?translation=almeida`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (!data.verses || data.verses.length === 0) {
                    throw new Error("Nenhum versículo encontrado");
                }
                
                let html = `<h2 class="chapter-title">${bookPt} ${chapter}</h2>`;
                
                data.verses.forEach(verse => {
                    html += `
                        <div class="verse" style="font-size: ${currentFontSize}rem;">
                            <sup class="verse-num">${verse.verse}</sup>
                            ${verse.text}
                        </div>
                    `;
                });
                
                contentDiv.innerHTML = html;
                window.scrollTo({ top: 0, behavior: 'smooth' });

            } catch (error) {
                console.error('Erro ao carregar:', error);
                contentDiv.innerHTML = `
                    <div class="error">
                        <h3>😕 Ops! Não foi possível carregar</h3>
                        <p><strong>Livro:</strong> ${bookPt} ${chapter}</p>
                        <p>O servidor pode estar indisponível. Tente:</p>
                        <ul style="text-align: left; margin: 15px 0; padding-left: 20px;">
                            <li>Aguardar alguns segundos</li>
                            <li>Verificar sua conexão com internet</li>
                            <li>Tentar outro livro</li>
                        </ul>
                        <button class="retry-btn" onclick="loadChapter()">🔄 Tentar Novamente</button>
                    </div>
                `;
            }
        }

        function changeFontSize(delta) {
            currentFontSize += delta * 0.1;
            if (currentFontSize < 0.8) currentFontSize = 0.8;
            if (currentFontSize > 2.0) currentFontSize = 2.0;
            
            const verses = document.querySelectorAll('.verse');
            verses.forEach(v => v.style.fontSize = `${currentFontSize}rem`);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        // Carrega automaticamente Provérbios 1
        setTimeout(() => loadChapter(), 500);
    </script>
</body>
</html>
